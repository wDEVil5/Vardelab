# Despliegue de migraciones a Supabase (producción).
#
# Se ejecuta en cada push a `main` (es decir, cuando se mergea un PR).
# Aplica las migraciones de supabase/migrations/ contra la base de datos remota
# usando la CLI de Supabase. Reemplaza al `supabase db push` manual.
#
# Requiere tres secrets configurados en el repo
# (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  → token de la cuenta (Supabase → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   → contraseña de la base del proyecto remoto
#   SUPABASE_PROJECT_ID    → project-ref del proyecto remoto

name: Deploy migrations

on:
  push:
    branches: [main]
    # Corre solo si cambian migraciones o la config de Supabase.
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-migrations.yml"

  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar la CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar con el proyecto remoto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Aplicar las migraciones
        run: supabase db push
